function drawQR(cv,text){const q=qrcode(0,"M");q.addData(text);q.make();const n=q.getModuleCount(),cs=Math.max(3,Math.floor(240/n)),m=cs*2,sz=n*cs+2*m;cv.width=cv.height=sz;const x=cv.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,sz,sz);x.fillStyle="#000";for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))x.fillRect(m+k*cs,m+r*cs,cs,cs)}
async function subir(cv){
  const tok=++upTok,qc=$("qrc"),t=$("qrt");qc.hidden=true;
  if(!S.view){t.textContent="Falta la dirección de la página de fotos (administrador)";return}
  t.textContent="Subiendo tu foto...";
  try{
    const r=await fetch("https://firestore.googleapis.com/v1/projects/"+FB.p+"/databases/(default)/documents/fotos?key="+FB.k,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({fields:{img:{stringValue:pack(cv)},creada:{timestampValue:new Date().toISOString()},evento:{stringValue:S.t||""}}})});
    if(!r.ok)throw new Error(r.status);
    const j=await r.json(),id=j.name.split("/").pop();
    if(tok!==upTok)return;
    drawQR(qc,S.view+(S.view.includes("?")?"&":"?")+"id="+id);qc.hidden=false;t.textContent="Escanea y descarga tu foto";
  }catch(e){if(tok===upTok)t.textContent="Sin conexión: usa Imprimir o Guardar"}
}
let busy=false,idle=null;
async function run(mode){
  if(busy||admin)return;busy=true;beep(880,.1);$("start").style.display="none";
  const total=mode==="strip"?3:1,shots=[],c=$("count");
  for(let k=0;k<total;k++){
    $("lab").textContent=total>1?"Foto "+(k+1)+" de "+total:"Prepárate";
    c.style.display="flex";
    for(let i=S.n;i>0;i--){$("num").textContent=i;c.classList.remove("tick");void c.offsetWidth;c.classList.add("tick");beep(660,.12);await sleep(1000)}
    c.style.display="none";
    const f=$("flash");f.style.transition="none";f.style.opacity=1;beep(1300,.25);
    shots.push(mode==="strip"?grab(780,585):grab(1080,1620));
    await sleep(70);f.style.transition="opacity .6s";f.style.opacity=0;
    if(k<total-1)await sleep(900);
  }
  const out=mode==="strip"?strip(shots):single(shots[0]),url=out.toDataURL("image/jpeg",.92);
  $("rimg").src=url;$("pimg").src=url;$("result").style.display="flex";subir(out);
  clearTimeout(idle);idle=setTimeout(reset,75000);
}
function reset(){upTok++;clearTimeout(idle);$("result").style.display="none";$("start").style.display="flex";busy=false}
$("b1").onclick=()=>run("single");$("b3").onclick=()=>run("strip");
document.addEventListener("keydown",e=>{if(e.code==="Space"&&!busy&&!admin&&e.target===document.body)run("single")});
$("again").onclick=reset;
$("print").onclick=()=>{clearTimeout(idle);window.print();idle=setTimeout(reset,75000)};
$("dl").onclick=()=>{const a=document.createElement("a");a.href=$("rimg").src;a.download="foto-"+Date.now()+".jpg";a.click()};

["sec","Titulares (formato TÍTULO|descripción)"],["l1","Titular 1 (izquierda)","text"],["l2","Titular 2 (izquierda)","text"],["l3","Titular 3 (derecha)","text"],["l4","Titular 4 (derecha)","text"],
["sec","Colores"],["mastColor","Color de la revista","color"],["nameColor","Color del nombre","color"],["accent","Color de acento","color"],["txt","Color de textos","color"],["ui","Color de botones y cuenta regresiva","color"],["numc","Color del número de la cuenta regresiva","color"],["bgc","Color de fondo de la pantalla","color"],["shade","Color del degradado sobre la foto","color"],["qrFg","Color de los puntos del QR (debe contrastar con su fondo)","color"],["qrBg","Color de fondo del QR (debe contrastar con los puntos)","color"],["th","Estilo del marco clásico","select",Object.keys(TH).map(k=>[k,TH[k].n])],
["sec","Extras"],["cor","Código en la esquina de la portada","select",[["qr","Código QR"],["barcode","Código de barras"],["none","Ninguno"]]],["qr","Contenido del QR (enlace de tu web, WhatsApp, Instagram...)","text"],["price","Texto junto al código (precio, Escanéame...)","text"],["b","Marca o web (pie de portada)","text"],["fav","Emoji del ícono de la pestaña (favicon)","text"],["ptitle","Título de la pestaña del navegador","text"],["view","Dirección de la página de fotos (ver.html en tu GitHub Pages)","text"],["n","Segundos de cuenta regresiva","range",[1,9]],["rot","Girar la pantalla (si el TV está en vertical y Windows no lo gira)","select",[["0","No girar"],["90","Girar 90° a la derecha"],["270","Girar 90° a la izquierda"],["180","Girar 180°"]]],["logo","Logo del cliente (opcional)","file"],["pin","PIN de administrador (opcional, déjalo vacío para no usar)","text"]];

function build(){
  const f=$("form");f.innerHTML="";
  F.forEach(r=>{
    if(r[0]==="sec"){f.insertAdjacentHTML("beforeend","<h3>"+r[1]+"</h3>");return}
    const [k,l,t,o]=r,id="id='f_"+k+"'";let inp;
    if(t==="select")inp="<select "+id+">"+o.map(a=>"<option value='"+a[0]+"'>"+a[1]+"</option>").join("")+"</select>";
    else if(t==="range")inp="<input "+id+" type='range' min='"+o[0]+"' max='"+o[1]+"'>";
    else if(t==="checkbox")inp="<input "+id+" type='checkbox'>";
    else if(t==="color")inp="<input "+id+" type='color'>";
    else if(t==="file")inp="<input "+id+" type='file' accept='image/*'>";
    else inp="<input "+id+" type='text'>";
    f.insertAdjacentHTML("beforeend","<label>"+l+inp+"</label>");
  });
  F.forEach(r=>{
    if(r[0]==="sec")return;const k=r[0],t=r[2],el=$("f_"+k);
    if(t==="file"){el.onchange=e=>{const fl=e.target.files[0];if(!fl)return;const rd=new FileReader();
      rd.onload=()=>{const i=new Image();i.onload=()=>{const q=Math.min(1,500/i.width,250/i.height),c=document.createElement("canvas");c.width=i.width*q;c.height=i.height*q;c.getContext("2d").drawImage(i,0,0,c.width,c.height);D.logo=c.toDataURL("image/png");pvDraw()};i.src=rd.result};rd.readAsDataURL(fl)};return}
    el.oninput=el.onchange=()=>{D[k]=t==="checkbox"?el.checked:t==="range"?+el.value:el.value;pvDraw()};
  });
  $("presets").innerHTML=P.map((p,i)=>"<button data-i='"+i+"'>"+p[0]+"</button>").join("");
  $("presets").querySelectorAll("button").forEach(b=>b.onclick=()=>{Object.assign(D,P[+b.dataset.i][1]);D.ui=D.accent;fill();pvDraw()});
}
function fill(){F.forEach(r=>{if(r[0]==="sec"||r[2]==="file")return;const el=$("f_"+r[0]);if(r[2]==="checkbox")el.checked=!!D[r[0]];else el.value=D[r[0]]})}
function pvDraw(){
  const c=$("pv"),x=c.getContext("2d"),k=CUR;CUR=D;
  if(v.videoWidth)x.drawImage(grab(1080,1620),0,0);
  else{const g=x.createLinearGradient(0,0,0,1620);g.addColorStop(0,"#4a4468");g.addColorStop(1,"#14121c");x.fillStyle=g;x.fillRect(0,0,1080,1620)}
  drawFrame(x,1080,1620);CUR=k;
}
setInterval(()=>{if(admin)pvDraw()},600);
function openAdmin(){admin=true;D={...S};fill();$("admin").style.display="grid";pvDraw()}
function route(){
  const on=location.hash==="#admin";$("admin").style.display="none";$("pin").style.display="none";
  if(on){if(S.pin&&!unlocked){$("pin").style.display="flex";$("pi").value="";$("pe").textContent=""}else openAdmin()}
  else{admin=false;CUR=S;apply()}
}
