<style>

<script>

 l1:"INOLVIDABLE|La noche que todos recordarán",l2:"GLAMOUR|Estilo y elegancia",l3:"15 AÑOS|Una historia que brilla",l4:"EXCLUSIVO|Solo en esta edición",
 mastColor:"#ffffff",nameColor:"#ffffff",accent:"#f2d27a",txt:"#ffffff",th:"oro",price:"Escanéame",cor:"qr",qr:"https://tu-sitio.com",view:"",fav:"📸",ptitle:"Fotoespejo",bgc:"#050507",ui:"#f2d27a",numc:"#ffffff",shade:"#000000",qrFg:"#000000",qrBg:"#ffffff",rot:"0",paper:"",dup:true,trig:"touch",bmode:"single",hint:"Presiona el botón para tu foto",dbl:false,c1:"#0b4f9c",c2:"#f2b705",c3:"#ffffff",gest:false,ghold:1,gtxt:"👍 Pulgar arriba = 1 foto · ✌️ Paz (V) = tira de 3 fotos",b:"",n:3,logo:"",pin:""};

const LC={};

const grad=(x,a,b,c,d)=>{const g=x.createLinearGradient(a,b,c,d),G=(CUR.tpl&&CUR.tpl!=="clasico"&&CUR.tpl!=="revista")?[CUR.c1,CUR.c2,CUR.c1]:TH[CUR.th].g;g.addColorStop(0,G[0]);g.addColorStop(.5,G[1]);g.addColorStop(1,G[2]);return g};
function txt(x,s,cx,y,font,fill,sp,mw,al){x.font=font;x.fillStyle=fill;x.textAlign=al||"center";x.textBaseline="middle";try{x.letterSpacing=(sp||0)+"px"}catch(e){}x.fillText(s,cx,y,mw||x.canvas.width-160);try{x.letterSpacing="0px"}catch(e){}}
function fit(x,s,fam,sty,maxW,max){x.font=sty+" 700 100px '"+fam+"',serif";return Math.min(max,100*maxW/Math.max(1,x.measureText(s).width))}

const hx=(h,a)=>{const n=parseInt(h.slice(1),16);return "rgba("+(n>>16&255)+","+(n>>8&255)+","+(n&255)+","+a+")"};

}
const lum=h=>{const n=parseInt(h.slice(1),16);return .299*(n>>16&255)+.587*(n>>8&255)+.114*(n&255)};

const TPL={
corp(x,W,H,c){

function build(){
  const f=$("form");f.innerHTML="";
  F.forEach(r=>{
    if(r[0]==="sec"){f.insertAdjacentHTML("beforeend","<h3>"+r[1]+"</h3>");return}
    const [k,l,t,o]=r,id="id='f_"+k+"'";let inp;
    if(t==="select")inp="<select "+id+">"+o.map(a=>"<option value='"+a[0]+"'>"+a[1]+"</option>").join("")+"</select>";
    else if(t==="range")inp="<input "+id+" type='range' min='"+o[0]+"' max='"+o[1]+"'>";
    else if(t==="checkbox")inp="<input "+id+" type='checkbox'>";
    else if(t==="color")inp="<input "+id+" type='color'>";
    else if(t==="file")inp="<input "+id+" type='file' accept='image/*'>";
    else inp="<input "+id+" type='text'>";
    f.insertAdjacentHTML("beforeend","<label>"+l+inp+"</label>");
  });
  F.forEach(r=>{
    if(r[0]==="sec")return;const k=r[0],t=r[2],el=$("f_"+k);
    if(t==="file"){el.onchange=e=>{const fl=e.target.files[0];if(!fl)return;const rd=new FileReader();
      rd.onload=()=>{const i=new Image();i.onload=()=>{const q=Math.min(1,500/i.width,250/i.height),c=document.createElement("canvas");c.width=i.width*q;c.height=i.height*q;c.getContext("2d").drawImage(i,0,0,c.width,c.height);D.logo=c.toDataURL("image/png");pvDraw()};i.src=rd.result};rd.readAsDataURL(fl)};return}
    el.oninput=el.onchange=()=>{D[k]=t==="checkbox"?el.checked:t==="range"?+el.value:el.value;pvDraw()};
  });
  $("packs").innerHTML=PK.map((p,i)=>"<button data-i='"+i+"'>"+p[0]+"</button>").join("");
  $("packs").querySelectorAll("button").forEach(b=>b.onclick=()=>{Object.assign(D,PK[+b.dataset.i][1]);D.accent=D.ui=D.c1;fill();pvDraw()});
  $("presets").innerHTML=P.map((p,i)=>"<button data-i='"+i+"'>"+p[0]+"</button>").join("");
  $("presets").querySelectorAll("button").forEach(b=>b.onclick=()=>{Object.assign(D,P[+b.dataset.i][1]);D.ui=D.accent;fill();pvDraw()});
}
function fill(){F.forEach(r=>{if(r[0]==="sec"||r[2]==="file")return;const el=$("f_"+r[0]);if(r[2]==="checkbox")el.checked=!!D[r[0]];else el.value=D[r[0]]})}
function pvDraw(){
  const c=$("pv"),x=c.getContext("2d"),k=CUR;CUR=D;
  if(v.videoWidth)x.drawImage(grab(1080,1620),0,0);
  else{const g=x.createLinearGradient(0,0,0,1620);g.addColorStop(0,"#4a4468");g.addColorStop(1,"#14121c");x.fillStyle=g;x.fillRect(0,0,1080,1620)}
  drawFrame(x,1080,1620);CUR=k;
}

  const on=location.hash==="#admin";$("admin").style.display="none";$("pin").style.display="none";
  if(on){if(S.pin&&!unlocked){$("pin").style.display="flex";$("pi").value="";$("pe").textContent=""}else openAdmin()}

}

$("a_lc").onclick=()=>{
  if(!D.logo){alert("Primero sube el logo del cliente.");return}
  const im=new Image();im.onload=()=>{
    const cv=document.createElement("canvas");cv.width=cv.height=48;const x=cv.getContext("2d");x.drawImage(im,0,0,48,48);
    const d=x.getImageData(0,0,48,48).data,m={};
    for(let k=0;k<d.length;k+=4){
      if(d[k+3]<200)continue;const r=d[k],g=d[k+1],b=d[k+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b);
      if(mx>235&&mn>225)continue;if(mx<30)continue;
      const key=(r>>5)+","+(g>>5)+","+(b>>5),o=m[key]=m[key]||{n:0,r:0,g:0,b:0};o.n++;o.r+=r;o.g+=g;o.b+=b;
    }
    const arr=Object.values(m).sort((a,b)=>b.n-a.n).map(o=>[o.r/o.n,o.g/o.n,o.b/o.n].map(Math.round)),pick=[];
    for(const q of arr){if(pick.every(p=>Math.abs(p[0]-q[0])+Math.abs(p[1]-q[1])+Math.abs(p[2]-q[2])>110))pick.push(q);if(pick.length===3)break}
    const hex=a=>"#"+a.map(v=>v.toString(16).padStart(2,"0")).join("");
    if(pick[0]){D.c1=hex(pick[0]);D.accent=D.ui=D.c1}if(pick[1])D.c2=hex(pick[1]);if(pick[2])D.c3=hex(pick[2]);
    fill();pvDraw();
  };im.src=D.logo;
};
